<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        dialog {
            margin: auto;
            border: none;
            padding: 1rem;
            text-align: center;
        }
        ::backdrop{
            background-color: black;
            opacity: 0.25;
        }
    </style>
</head>
<body>
    <button onclick="abrirModal()">dialog</button>
    <dialog id="modal">
        <h1>rolão mundo</h1>
        <button onclick="fecharModal()">fechar</button>
    </dialog>
    
    <script>
        const modal = document.getElementById("modal")
        function abrirModal(){
            modal.showModal()
        }
        function fecharModal(){
            modal.close()
        }
    </script>
</body>
</html>
